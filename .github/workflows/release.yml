# Builds, tests and packs a v* tag, then creates the GitHub release with the package attached.
#
# The version comes from the tag itself through MinVer. Publishing to NuGet is deliberately not
# automated: download the .nupkg from the release and push it by hand when you are ready.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  PROJECT_PATH: src/SqlCdc/SqlCdc.csproj

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Without the full history MinVer cannot see the tag and would version the package as a
          # pre-release of MinVerMinimumMajorMinor — a silently wrong release.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/SqlCdc.Tests --configuration Release --no-build

      - name: Integration tests
        run: dotnet test tests/SqlCdc.IntegrationTests --configuration Release --no-build

      - name: Pack
        run: dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build -o ./artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
